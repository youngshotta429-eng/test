<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CRITICAL SECURITY BREACH</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      height: 100vh;
      background: #030303;
      color: #ff003c;
      font-family: 'Share Tech Mono', monospace;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      cursor: pointer;
    }

    #matrix-bg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      opacity: 0.15;
      z-index: 0;
    }

    .terminal {
      position: relative;
      z-index: 1;
      width: 90%;
      max-width: 520px;
      background: rgba(0, 0, 0, 0.9);
      border: 2px solid #ff003c;
      border-radius: 10px;
      padding: 25px;
      box-shadow: 0 0 30px rgba(255, 0, 60, 0.4);
      text-align: left;
    }

    .alert-header {
      font-size: 1.2rem;
      color: #ff003c;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 15px;
      animation: blink 0.8s infinite alternate;
    }

    @keyframes blink {
      from { opacity: 1; }
      to { opacity: 0.3; }
    }

    .log-box {
      height: 160px;
      overflow: hidden;
      font-size: 0.85rem;
      color: #ff5577;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      margin-bottom: 20px;
      background: rgba(0,0,0,0.5);
      padding: 10px;
      border: 1px solid rgba(255, 0, 60, 0.2);
      border-radius: 6px;
    }

    .log-line {
      margin-bottom: 4px;
    }

    .progress-bar-container {
      width: 100%;
      height: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid #ff003c;
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      width: 0%;
      height: 100%;
      background: #ff003c;
      box-shadow: 0 0 15px #ff003c;
      transition: width 0.4s ease;
    }

    .status-text {
      margin-top: 10px;
      font-size: 0.8rem;
      color: #aaa;
      display: flex;
      justify-content: space-between;
    }

    .reveal-card {
      display: none;
      position: relative;
      z-index: 2;
      background: #111;
      border: 2px solid #880303;
      padding: 30px 20px;
      border-radius: 16px;
      text-align: center;
      width: 90%;
      max-width: 420px;
      box-shadow: 0 0 40px rgba(0, 255, 65, 0.4);
    }

    .reveal-card h1 {
      font-size: 2.2rem;
      color: #941605;
      margin-bottom: 10px;
    }

    .reveal-video {
      width: 100%;
      max-height: 320px;
      border-radius: 10px;
      margin: 15px 0;
      object-fit: cover;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .reveal-card p {
      color: #750404;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>

  <!-- Hacking Screen -->
  <div class="terminal" id="terminal-box">
    <div class="alert-header">🚨 CRITICAL SYSTEM BREACH IN PROGRESS</div>
    
    <div class="log-box" id="logs">
      <div class="log-line">> Initiating system override...</div>
    </div>

    <div class="progress-bar-container">
      <div class="progress-bar" id="progress"></div>
    </div>

    <div class="status-text">
      <span>TRANSFER RATE: 84 MB/s</span>
      <span id="percent-text">0%</span>
    </div>
  </div>

  <!-- Prank Reveal Screen with Video -->
  <div class="reveal-card" id="reveal-box">
    <h1>nadale kita tanga! 😂</h1>
    
    <video id="vid" src="https://files.catbox.moe/yggtys.mp4" playsinline loop class="reveal-video"></video>

    <p>ingat ka gengokoo!</p>
  </div>

  <script>
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine') {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const chars = '0123456789ABCDEF';
    const drops = Array(Math.floor(canvas.width / 16)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(3, 3, 3, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff003c';
      ctx.font = '14px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * 16, drops[i] * 16);
        if (drops[i] * 16 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);

    const logs = document.getElementById('logs');
    const progress = document.getElementById('progress');
    const percentText = document.getElementById('percent-text');
    const terminalBox = document.getElementById('terminal-box');
    const revealBox = document.getElementById('reveal-box');
    const video = document.getElementById('vid');

    const steps = [
      { text: "Bypassing local firewall...", pct: 15, sound: 300 },
      { text: "Accessing stored credentials & passwords...", pct: 35, sound: 450 },
      { text: "Extracting browser history & tokens...", pct: 55, sound: 600 },
      { text: "Encrypted drive access granted...", pct: 78, sound: 750 },
      { text: "Wiping device logs...", pct: 92, sound: 900 },
      { text: "OVERRIDE COMPLETE.", pct: 100, sound: 1200 }
    ];

    let step = 0;

    function runPrank() {
      if (step < steps.length) {
        const current = steps[step];
        
        const line = document.createElement('div');
        line.className = 'log-line';
        line.innerText = `> ${current.text}`;
        logs.appendChild(line);
        logs.scrollTop = logs.scrollHeight;

        progress.style.width = current.pct + '%';
        percentText.innerText = current.pct + '%';
        
        try { playBeep(current.sound, 'sawtooth'); } catch(e){}

        step++;
        setTimeout(runPrank, 1100);
      } else {
        setTimeout(() => {
          terminalBox.style.display = 'none';
          revealBox.style.display = 'block';
          
          video.currentTime = 0;
          video.muted = false;
          video.volume = 1.0;
          video.play().catch(e => console.log("Playback error:", e));
          
          try { playBeep(800, 'sine'); } catch(e){}
        }, 1000);
      }
    }

    document.body.addEventListener('click', () => { 
      if (audioCtx.state === 'suspended') audioCtx.resume(); 
    }, { once: true });

    setTimeout(runPrank, 1000);
  </script>
</body>
</html>
